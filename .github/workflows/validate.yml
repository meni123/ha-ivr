name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # שבועי: hassfest ו-HACS משתנים מתחתינו, ותקלה שם אינה
    # קשורה לדחיפה שלנו — עדיף לגלות אותה בשקט מאשר בהתקנה.
    - cron: "0 4 * * 1"

permissions:
  contents: read

# הפעולות נעוצות ל-SHA מלא, וההערה אומרת לאיזו גרסה הוא שייך.
# Dependabot (`.github/dependabot.yml`) מציע עדכון כשיוצאת חדשה.
jobs:
  gate:
    name: השער
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # כמו Home Assistant 2026.11.
          python-version: "3.13"

      # בלי pip install ובלי דרישות: הבדיקות רצות על פייתון נקי
      # מול Home Assistant מזויף. זו הסיבה שהן מהירות כאן.
      - name: run_live
        run: python3 tests/run_live.py

      - name: run_capabilities
        run: python3 tests/run_capabilities.py

      - name: run_setup
        run: python3 tests/run_setup.py

      - name: run_sip
        run: python3 tests/run_sip.py

      - name: check_names
        run: python3 tests/check_names.py

      - name: check_flow
        run: python3 tests/check_flow.py

      - name: check_gate
        run: python3 tests/check_gate.py

      - name: check_methods
        run: python3 tests/check_methods.py

      - name: check_strings
        run: python3 tests/check_strings.py

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # המודולים החדשים בלבד: שם אין היסטוריה של סגנון אחר.
      - name: ruff
        run: |
          python3 -m pip install --quiet ruff
          ruff check --select E,F,W,B,UP,SIM --ignore E501,SIM102 \
            custom_components/ha_ivr/capabilities.py \
            custom_components/ha_ivr/i18n.py \
            custom_components/ha_ivr/call.py \
            custom_components/ha_ivr/speech.py \
            custom_components/ha_ivr/security.py \
            custom_components/ha_ivr/dictation.py

  panel:
    name: לוח המקשים
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: check_panel
        run: node tests/check_panel.mjs

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-10-26

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-06-08
        with:
          category: integration
