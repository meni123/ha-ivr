name: Feature request
description: Something the integration should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        עברית או אנגלית — שתיהן בסדר גמור.

  - type: textarea
    id: what
    attributes:
      label: What should it do
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What are you trying to achieve
      description: |
        The situation, not the solution. There is often a way that already
        works, and knowing the goal is what finds it.
    validations:
      required: true
